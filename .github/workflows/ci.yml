name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

permissions:
  contents: read
  pull-requests: write

jobs:
  check:
    name: check / fmt / clippy / test
    runs-on: ubuntu-latest
    env:
      # The Python e2e tests in crates/helios-cli/tests/cli.rs fail (not skip) without the venv.
      HELIOS_REQUIRE_PY: "1"
    steps:
      - uses: actions/checkout@v4

      - name: No secrets, state or plan files in the tree
        run: python3 scripts/check_publishable.py

      - name: Publish-guard tests (check_publishable, scrub_tfjson)
        run: python3 -m unittest discover -s scripts -v

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.8.x"

      - name: Sync helios-ai venv (needed by the Rust e2e pipe test)
        run: uv sync --frozen
        working-directory: helios-ai

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace --all-targets

      - name: cargo doc
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"

  msrv:
    name: msrv / cargo check (Rust 1.88)
    runs-on: ubuntu-latest
    env:
      # Overrides rust-toolchain.toml's `stable` channel.
      RUSTUP_TOOLCHAIN: "1.88"
      # z3-sys downloads its prebuilt Z3 from GitHub releases; authenticated to dodge the rate limit.
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@1.88

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2

      - name: cargo check on the declared rust-version
        run: cargo check --workspace --all-targets --locked

  python-check:
    name: python / ruff / pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: helios-ai
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.8.x"

      - name: Sync dependencies
        run: uv sync --frozen

      - name: ruff check
        run: uv run ruff check

      - name: pytest
        run: uv run pytest -v

  web-check:
    name: web / build / vitest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: npm ci
        run: npm ci

      - name: vitest
        run: npm run test

      - name: vite build
        run: npm run build

  action-smoke:
    name: action / smoke (inspect + comment body)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2

      - name: Run helios action against fixture scenarios
        id: helios
        uses: ./action
        with:
          github-token: ${{ github.token }}

      - name: Assert artifact dir contents
        shell: bash
        run: |
          set -euo pipefail
          dir='${{ steps.helios.outputs.artifact-dir }}'
          test -d "$dir"
          test -s "$dir/az-outage.json"
          jq -e '.graph.nodes | length > 0' "$dir/az-outage.json" > /dev/null
          jq -e '.chain.failures | length > 0' "$dir/az-outage.json" > /dev/null
          test -f "$dir/az-outage.verify.txt"

      - name: Assert sticky-comment body has marker + scenario summary
        shell: bash
        run: |
          set -euo pipefail
          path='${{ steps.helios.outputs.comment-body }}'
          test -s "$path"
          grep -q '<!-- helios-action -->' "$path"
          grep -q 'az-outage' "$path"
          grep -q 'iam-revocation' "$path"

      - name: Run helios action with fail-on=failures (must fail)
        id: helios-gate
        continue-on-error: true
        uses: ./action
        with:
          github-token: ${{ github.token }}
          fail-on: failures
          artifact-name: helios-inspect-gate

      - name: Assert fail-on=failures failed the job step
        shell: bash
        run: |
          echo "fail-on=failures outcome: ${{ steps.helios-gate.outcome }}"
          test "${{ steps.helios-gate.outcome }}" = failure

      - name: Run helios action on an inconclusive scenario (must fail, must say so)
        id: helios-inconclusive
        continue-on-error: true
        uses: ./action
        with:
          github-token: ${{ github.token }}
          terraform-json: fixtures/iam-inconclusive/plan.json
          scenarios-glob: fixtures/iam-inconclusive/*.yaml
          fail-on: failures
          artifact-name: helios-inspect-inconclusive

      - name: Assert the inconclusive scenario is reported, not passed
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.helios-inconclusive.outcome }}" = failure
          grep -q 'inconclusive' "${{ runner.temp }}/helios-comment.md"
          grep -q 'INCONCLUSIVE' "${{ runner.temp }}/helios-comment.md"

      - name: Run helios action on WARDEN's real Wave 4 plan (zone + NAT loss must be inconclusive)
        id: helios-wave4
        continue-on-error: true
        uses: ./action
        with:
          github-token: ${{ github.token }}
          terraform-json: fixtures/wave4-fullstack/plan.json
          scenarios-glob: fixtures/wave4-fullstack/scenarios/*.yaml
          fail-on: failures
          artifact-name: helios-inspect-wave4

      - name: Assert the real plan's unplaceable Lambdas make it inconclusive, not a pass
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.helios-wave4.outcome }}" = failure
          grep -q 'INCONCLUSIVE' "${{ runner.temp }}/helios-comment.md"
          grep -q 'order-processor' "${{ runner.temp }}/helios-comment.md"
