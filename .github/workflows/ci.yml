name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

permissions:
  contents: read
  pull-requests: write

jobs:
  check:
    name: check / fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.8.x"

      - name: Sync helios-ai venv (needed by the Rust e2e pipe test)
        run: uv sync --frozen
        working-directory: helios-ai

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace --all-targets

      - name: cargo doc
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"

  python-check:
    name: python / ruff / pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: helios-ai
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.8.x"

      - name: Sync dependencies
        run: uv sync --frozen

      - name: ruff check
        run: uv run ruff check

      - name: pytest
        run: uv run pytest -v

  web-check:
    name: web / build / vitest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: npm ci
        run: npm ci

      - name: vitest
        run: npm run test

      - name: vite build
        run: npm run build

  action-smoke:
    name: action / smoke (inspect + comment body)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2

      - name: Run helios action against fixture scenarios
        id: helios
        uses: ./action
        with:
          github-token: ${{ github.token }}

      - name: Assert artifact dir contents
        shell: bash
        run: |
          set -euo pipefail
          dir='${{ steps.helios.outputs.artifact-dir }}'
          test -d "$dir"
          test -s "$dir/az-outage.json"
          jq -e '.graph.nodes | length > 0' "$dir/az-outage.json" > /dev/null
          jq -e '.chain.failures | length > 0' "$dir/az-outage.json" > /dev/null
          test -f "$dir/az-outage.verify.txt"

      - name: Assert sticky-comment body has marker + scenario summary
        shell: bash
        run: |
          set -euo pipefail
          path='${{ steps.helios.outputs.comment-body }}'
          test -s "$path"
          grep -q '<!-- helios-action -->' "$path"
          grep -q 'az-outage' "$path"
          grep -q 'iam-revocation' "$path"
