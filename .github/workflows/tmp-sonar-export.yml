name: tmp-sonar-export
# Temporary (never merged): prints SonarCloud's open issues and hotspots on main, and the open
# code-scanning alerts, so they can be read from the job log. sonarcloud.io is public for this project.
on:
  push:
    branches: [claude/hel-sonar-export-tmp]
permissions:
  contents: read
  security-events: read
jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - name: workflow commands written to stderr become annotations
        run: |
          echo "::error::hel-probe error on stderr" >&2
          echo "::warning::hel-probe warning on stderr" >&2
          echo "::error::hel-probe error on stdout"
      - name: code-scanning alerts on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/${GITHUB_REPOSITORY}/code-scanning/alerts?ref=refs/heads/main&state=open&per_page=100" \
            --jq '.[] | "CS|\(.tool.name)|\(.rule.id)|\(.rule.security_severity_level // .rule.severity)|\(.most_recent_instance.location.path):\(.most_recent_instance.location.start_line)|\(.number)|\(.most_recent_instance.message.text | gsub("\n";" ") | .[0:200])"' \
            || echo "CS-ERROR could not list alerts"
      - name: SonarCloud issues and hotspots on main
        shell: python
        run: |
          import json, time, urllib.request
          base = "https://sonarcloud.io/api/issues/search?componentKeys=veerarakesh56_helios&branch=main&resolved=false&ps=500"
          def get(url):
              for attempt in range(5):
                  try:
                      with urllib.request.urlopen(url, timeout=60) as r:
                          return json.load(r)
                  except Exception as e:
                      print("retry", attempt, e); time.sleep(5)
              raise SystemExit("sonar api unreachable")
          d = get(base)
          print(f"=== ISSUES total={d['total']}")
          for i in d["issues"]:
              imp = ",".join(f"{x['softwareQuality'][0]}{x['severity'][0]}" for x in i.get("impacts", []))
              comp = i["component"].split(":", 1)[-1]
              msg = i["message"].replace("\n", " ")[:300]
              flows = len(i.get("flows", []))
              print(f"I|{i['rule']}|{i.get('type','')}|{imp}|{comp}|{i.get('line', '')}|{i['key']}|{msg}|flows={flows}")
          h = get("https://sonarcloud.io/api/hotspots/search?projectKey=veerarakesh56_helios&branch=main&status=TO_REVIEW&ps=500")
          print(f"=== HOTSPOTS to review total={h['paging']['total']}")
          for i in h["hotspots"]:
              comp = i["component"].split(":", 1)[-1]
              print(f"H|{i['ruleKey']}|{i['vulnerabilityProbability']}|{comp}|{i.get('line', '')}|{i['key']}|{i['message'][:200]}")
          m = get("https://sonarcloud.io/api/measures/component?component=veerarakesh56_helios&branch=main&metricKeys=bugs,vulnerabilities,code_smells,security_hotspots,duplicated_lines_density,ncloc")
          print("=== MEASURES", json.dumps(m.get("component", {}).get("measures", [])))
